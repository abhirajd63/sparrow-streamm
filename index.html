<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sparrow Stream</title>

  <!-- Video.js CSS -->
  <link href="https://vjs.zencdn.net/8.22.1/video-js.css" rel="stylesheet" />

  <!-- Your CSS -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">
    <div class="player-section">
      <video
        id="main-player"
        class="video-js vjs-default-skin"
        controls
        preload="auto"
        width="100%"
        height="500"
        data-setup='{}'
      >
        <source src="" type="video/mp4" />
      </video>

      <div class="video-info">
        <h2 id="video-title">Select a video</h2>
        <p id="video-desc">Video description will appear here.</p>
      </div>
    </div>

    <div class="playlist-section">
      <h3>Up Next</h3>
      <div id="playlist"></div>
    </div>
  </div>

  <!-- Video.js JS -->
  <script src="https://vjs.zencdn.net/8.22.1/video.min.js"></script>

  <!-- Your JS -->
  <script src="script.js"></script>
</body>
</html>
