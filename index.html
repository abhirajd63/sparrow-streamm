<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sparrow Stream</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="stars"></div>

<nav>
  <div class="logo">🎬 SPARROW STREAM</div>

  <div class="search-container">
    <span class="search-icon">🔍</span>
    <input
      type="text"
      class="search-bar"
      id="searchBar"
      placeholder="Search movies and shows..."
    >
  </div>
</nav>

<main>

  <!-- VIDEO PLAYER -->
  <div class="video-container">
    <video id="player" controls preload="metadata"></video>

    <!-- VLC STYLE SKIP CONTROLS -->
    <div class="vlc-controls">
      <button onclick="seek(-10)">⏪ 10s</button>
      <button onclick="seek(-30)">⏪ 30s</button>
      <button onclick="seek(30)">⏩ 30s</button>
      <button onclick="seek(60)">⏩ 60s</button>
    </div>

    <!-- SEEK BAR -->
    <input type="range" id="seekBar" min="0" value="0" step="1">
  </div>

  <!-- PLAYLIST -->
  <div class="playlist-section">
    <h2 class="section-title">Explore the Galaxy</h2>
    <div id="playlist"></div>
  </div>

</main>

<script src="script.js"></script>

<script>
  const searchBar = document.getElementById("searchBar");

  searchBar.addEventListener("input", () => {
    const term = searchBar.value.toLowerCase();
    document.querySelectorAll(".card").forEach(card => {
      card.style.display = card.innerText.toLowerCase().includes(term)
        ? "block"
        : "none";
    });
  });
</script>

</body>
</html>
